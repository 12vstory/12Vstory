name: 네이버 블로그 자동연동

on:
  workflow_dispatch:
  schedule:
    # 매시 17분/47분: 약 30분 간격. 정각 혼잡을 피하도록 시간을 비켜 둠.
    - cron: '17,47 * * * *'

permissions:
  contents: write

concurrency:
  group: naver-blog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: 필요한 패키지 설치
        run: pip install -r scripts/requirements.txt

      - name: 네이버 블로그 동기화
        run: python scripts/sync_naver.py

      - name: 변경사항 저장
        shell: bash
        run: |
          git config user.name "12V STORY Auto Sync"
          git config user.email "actions@users.noreply.github.com"
          git add assets/naver-works.json assets/works-data.js
          if git diff --cached --quiet; then
            echo "새로운 변경사항이 없습니다."
            exit 0
          fi
          git commit -m "자동 업데이트: 네이버 블로그 작업갤러리"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
